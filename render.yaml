services:
  - type: worker
    name: artistmusic
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TOKEN
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DB_NAME
        value: MeowMusic
      - key: DURATION_LIMIT
        value: "4200"
      - key: QUEUE_LIMIT
        value: "24"
